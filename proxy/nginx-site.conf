# relay for github's oauth endpoints (they do not send CORS headers).
# the two location blocks below are meant to be pasted into an existing
# server block, e.g. the one serving this site's dist/, like:

#     server {
#         listen 4894;
#         ...
#         root /home/server/Documents/crosscode-mods-site/dist;
#
#         <paste the two location blocks here>
#
#         location / {
#             try_files $uri $uri.html $uri/ =404;
#         }
#     }

# notes:
# - with this setup leave `oauthProxyUrl` empty in src/config.ts, the site
#   then uses its own origin (no extra csp entries needed besides
#   connect-src https://api.github.com for the github api itself)
# - exact-match locations take precedence over `location /`, every other
#   path still hits the site
# - `proxy_buffer_size` + `proxy_buffers` are needed because github sends
#   huge response headers (~4-8k, content security policy + cookies) which
#   exceed nginx's default 8k proxy buffer -> "upstream sent too big header"
# - alternatively the response headers can be shrunk instead via
#   `proxy_hide_header Content-Security-Policy; proxy_hide_header Set-Cookie;`

