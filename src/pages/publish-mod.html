<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/png" href="/favicon.png" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>CCModDB mod publish</title>
        <meta name="darkreader-lock" />
    </head>
    <body>
        <main id="app">
            <!--shared-header-->
            <section id="main-content">
                <h1 id="login-notice" hidden="true">You must login first to submit a mod</h1>
                <div id="show-only-when-logged-in">
                    <form id="publish-form">
                        <div class="form-row grow">
                            <label for="mod-url">mod url</label>
                            <input
                                type="text"
                                id="mod-url"
                                placeholder="https://github.com/CCDirectLink/CCModManager/releases/download/v1.2.1/ccmodmanager-1.2.1.ccmod"
                                required
                            />
                        </div>

                        <div class="form-row">
                            <!--shared-db-select-->
                        </div>

                        <div class="form-row grow">
                            <label for="source">source (optional)</label>
                            <input type="text" id="source" />
                        </div>

                        <div class="form-row">
                            <button type="submit" id="check-button">Check</button>
                            <button type="submit" id="publish-button" disabled>Publish</button>
                        </div>
                    </form>
                    <section class="console-section">
                        <label>console</label>
                        <br />
                        <div id="console-output" class="editor-mount"></div>
                    </section>
                </div>
            </section>
        </main>
        <!--shared-speculationrules-->
        <script type="module" src="./publish-mod/publish-mod.ts"></script>
    </body>
</html>
