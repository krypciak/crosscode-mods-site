<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/png" href="/favicon.png" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Check ccmod.json</title>
        <meta name="darkreader-lock" />
    </head>
    <body>
        <main id="app" class="editor-page">
            <!--shared-header-->
            <section id="main-content">
                <div class="panels">
                    <section class="panel">
                        <label for="input-code">ccmod.json</label>
                        <div id="input-code" class="editor-mount"></div>
                    </section>
                </div>
                <section id="branch-section">
                    <!--shared-db-select-->
                    <br />

                    <label for="upload-btn">Extract ccmod.json from mod archive</label>
                    <button id="upload-btn">upload .zip / .ccmod</button>

                    <input type="file" id="file-input" accept=".zip,.ccmod,.json" hidden />
                </section>

                <section class="console-section">
                    <label for="console-output">console</label>
                    <br />
                    <div id="console-output" class="editor-mount"></div>
                </section>
            </section>
        </main>
        <!--shared-speculationrules-->
        <script type="module" src="./check-mod/check-mod.ts"></script>
    </body>
</html>
