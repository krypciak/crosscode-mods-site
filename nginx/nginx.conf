worker_processes auto;

pid logs/nginx.pid;

events {
    worker_connections 1024;
}

http {
    client_body_temp_path tmp/client-body;
    proxy_temp_path       tmp/proxy;
    fastcgi_temp_path     tmp/fastcgi;
    uwsgi_temp_path       tmp/uwsgi;
    scgi_temp_path        tmp/scgi;

    access_log logs/access.log;
    error_log  logs/error.log;

    types_hash_max_size 4096;

    include mime.types;
    default_type application/octet-stream;

    server_tokens off;

    proxy_cache_path tmp/proxy-cache
        levels=1:2
        keys_zone=zip_cache:10m
        max_size=500m
        inactive=5d;

    limit_req_zone $binary_remote_addr zone=main:10m rate=30r/s;

    include secret.conf;
    server {
        listen 4894;
        # server_name crosscode-mods.krypek.cc;

        # set-cors-headers on every response, including 404/405 answers
        add_header Access-Control-Allow-Origin "*" always;

        # no preflight handling needed: the site's requests are cors-simple
        # (Accept + form-urlencoded content type), but answer anyway
        add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
        if ($request_method = OPTIONS) {
            return 204;
        }

        root /home/krypek/Programming/repos/crosscode-mods-site/dist;
        index index.html;

        location = /access_token {
            limit_except POST { deny all; }
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $host;
            proxy_pass http://127.0.0.1:4895;
        }

        # location / {
        #     try_files $uri $uri/ /index.html;
        # }

        location / {
            proxy_pass http://localhost:5173; # Vite dev server address
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Crucial for HMR WebSocket connections
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
